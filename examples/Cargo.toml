[package]
name = "registry-examples"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "generate_idl"
path = "src/bin/generate_idl.rs"

[[bin]]
name = "registry_cli"
path = "src/bin/registry_cli.rs"

[[bin]]
name = "registry_browser"
path = "src/bin/registry_browser.rs"

[dependencies]
spel-framework = { git = "https://github.com/logos-co/spel.git", tag = "v0.7.0" }
nssa = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", package = "lee" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", package = "lee_core", features = ["host"] }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
spel = { git = "https://github.com/logos-co/spel.git", tag = "v0.7.0" }
registry_core = { path = "../registry_core" }
serde_json = "1.0"
base58 = "0.2"
tokio = { version = "1.28.2", features = ["net", "rt-multi-thread", "sync", "macros"] }
